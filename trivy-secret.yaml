# Trivy secret-scanner allow-list.
#
# Scoped to one path deliberately. The secret scanner stays ON for the rest of
# the image, so a real credential baked into a layer still fails the build —
# turning the whole scanner off to silence one demo file would have traded a
# genuine control for convenience.
#
# src/client/app.js is the browser demo the image serves on port 4001. Line 47
# returns the canonical jwt.io sample token from a function whose own comments
# read "For demo purposes, we're using a simulated token" and "we'll just return
# a dummy token". It decodes to:
#   header  {"alg":"HS256","typ":"JWT"}
#   payload {"sub":"demo-user","iat":1516239022}
# and 1516239022 is 2018-01-18, the timestamp jwt.io ships in its own example.
# It signs nothing and grants nothing.
#
# The same finding is recorded in .gitleaksignore with its commit fingerprint.
# If this file ever stops being the demo client, delete this rule rather than
# widening it.
allow-rules:
  - id: demo-client-sample-jwt
    description: jwt.io sample token in the bundled browser demo, not a credential
    path: (^|/)src/client/app\.js$
