# CI — this repo had no workflow at all, which is how the published image went
# from a clean scan on 2026-04-07 to 148 findings (9 critical, 52 high) by
# 2026-07-31 without a single commit. Nothing had changed; the world had.
#
# That is the whole argument for the schedule below. A push-triggered gate
# would never have fired, because there were no pushes. The weekly rebuild is
# what turns "it scanned clean once" into "it scans clean now".
name: CI

on:
  # The weekly audit heal pushes with GITHUB_TOKEN, which starts no push-triggered
  # run; it dispatches this workflow instead so the bot's commit still gets CI.
  workflow_dispatch: {}
  push:
  pull_request:
  schedule:
    - cron: "41 6 * * 1"

jobs:
  node:
    name: Node — audit + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # npm ci, never npm install — the lockfile is the contract.
      - name: Install (locked)
        run: npm ci

      # Gate on the total rather than --audit-level, which silently tolerates
      # everything beneath the threshold. The standard here is zero.
      - name: npm audit — fail on any advisory
        # The weekly advisory check now lives in audit.yml, which can also fix
        # what it finds; on the schedule this step would only fail first.
        if: github.event_name != 'schedule'
        run: |
          npm audit --json > audit.json || true
          total=$(node -p "JSON.parse(require('fs').readFileSync('audit.json','utf8')).metadata.vulnerabilities.total")
          echo "advisories: $total"
          if [ "$total" -ne 0 ]; then
            npm audit || true
            echo "::error::$total advisory/advisories. Fix, or record an accepted exception."
            exit 1
          fi

      - name: Tests
        run: npm test

  python:
    name: Python — audit requirements
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # pip-audit is pointed at requirements.txt explicitly. Run bare, it
      # audits its own environment instead of the project's and stays green
      # forever while saying nothing.
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          pip-audit --strict -r requirements.txt

  image:
    name: Image — build + scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: docker build -t xls-to-xlsx:ci .

      # Trivy rather than Docker Scout: no registry credentials needed, and it
      # covers the apk, npm and pypi layers in one pass. exit-code 1 fails the
      # job, which is the point — the scan is the gate, not a report.
      #
      # Both scanners run. `vuln` is the one this job exists for; `secret` is
      # kept on so a credential baked into a layer fails the build, with the one
      # known false positive allow-listed by path in trivy-secret.yaml rather
      # than by switching the scanner off.
      - name: Trivy — fail on any CRITICAL/HIGH/MEDIUM/LOW
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: xls-to-xlsx:ci
          scanners: vuln,secret
        env:
          TRIVY_SECRET_CONFIG: trivy-secret.yaml
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: CRITICAL,HIGH,MEDIUM,LOW
          vuln-type: os,library

      # Every advertised input format, not just the easy one. A CSV-only smoke
      # test passed while .xlsx and .ods were both completely broken — openpyxl
      # was pinned below what pandas required, and odfpy was missing from
      # requirements.txt entirely. Both are in ALLOWED_EXTENSIONS and the README.
      # Content is checked, not just the status code: a 200 returning the wrong
      # rows is not a pass.
      - name: Smoke test — all five input formats end to end
        run: |
          docker run -d --name xls-ci -p 4040:4040 xls-to-xlsx:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4040/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:4040/health

          python3 -m pip install --quiet openpyxl

          # Fail on the actual problem. sample.csv was caught by a *.csv rule in
          # .gitignore and never committed, so curl died with exit 26 ("cannot
          # read local file") and the log said nothing about a missing fixture.
          missing=0
          for ext in csv json xls xlsx ods; do
            if [ ! -f "test/fixtures/sample.$ext" ]; then
              echo "::error::fixture test/fixtures/sample.$ext is missing from the checkout — is it gitignored?"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          declare -A MIME=(
            [csv]="text/csv"
            [json]="application/json"
            [xls]="application/vnd.ms-excel"
            [xlsx]="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
            [ods]="application/vnd.oasis.opendocument.spreadsheet"
          )
          fail=0
          for ext in csv json xls xlsx ods; do
            code=$(curl -s -o "out_$ext.xlsx" -w "%{http_code}" \
              -F "file=@test/fixtures/sample.$ext;type=${MIME[$ext]}" \
              http://localhost:4040/convert)
            if [ "$code" != "200" ]; then
              echo "::error::$ext returned HTTP $code"
              cat "out_$ext.xlsx" || true
              fail=1
              continue
            fi
            # `if !` rather than `cmd; [ $? -ne 0 ] && fail=1`. Steps run under
            # `bash -e`, where that idiom aborts the step on a PASSING check,
            # because the && chain returns 1 when the test is false.
            if ! python3 test/verify-conversion.py "$ext" "out_$ext.xlsx"; then
              echo "::error::$ext failed verification"
              fail=1
            fi
          done
          docker rm -f xls-ci
          exit $fail

  # A cron failure notifies nobody the way a failed push does. The 2026-08-10
  # run failed on a nanoid advisory and went unread for three days. This turns
  # the weekly gate's failure into an issue instead of a red X in a tab.
  report-failure:
    name: File an issue when the scheduled run fails
    needs: [node, python, image]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh runs without a checkout here, so it cannot infer the repo from git.
          GH_REPO: ${{ github.repository }}
          TITLE: "Scheduled CI run is failing"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The scheduled CI run failed on $(date -u +%F). $RUN_URL"
          # One issue, commented on each week, rather than a new one per run.
          n=$(gh issue list --state open --search "$TITLE in:title" --json number,title \
                --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
