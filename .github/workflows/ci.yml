# CI — this repo had no workflow at all, which is how the published image went
# from a clean scan on 2026-04-07 to 148 findings (9 critical, 52 high) by
# 2026-07-31 without a single commit. Nothing had changed; the world had.
#
# That is the whole argument for the schedule below. A push-triggered gate
# would never have fired, because there were no pushes. The weekly rebuild is
# what turns "it scanned clean once" into "it scans clean now".
name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "41 6 * * 1"

jobs:
  node:
    name: Node — audit + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # npm ci, never npm install — the lockfile is the contract.
      - name: Install (locked)
        run: npm ci

      # Gate on the total rather than --audit-level, which silently tolerates
      # everything beneath the threshold. The standard here is zero.
      - name: npm audit — fail on any advisory
        run: |
          npm audit --json > audit.json || true
          total=$(node -p "JSON.parse(require('fs').readFileSync('audit.json','utf8')).metadata.vulnerabilities.total")
          echo "advisories: $total"
          if [ "$total" -ne 0 ]; then
            npm audit || true
            echo "::error::$total advisory/advisories. Fix, or record an accepted exception."
            exit 1
          fi

      - name: Tests
        run: npm test

  python:
    name: Python — audit requirements
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # pip-audit is pointed at requirements.txt explicitly. Run bare, it
      # audits its own environment instead of the project's and stays green
      # forever while saying nothing.
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          pip-audit --strict -r requirements.txt

  image:
    name: Image — build + scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: docker build -t xls-to-xlsx:ci .

      # Trivy rather than Docker Scout: no registry credentials needed, and it
      # covers the apk, npm and pypi layers in one pass. exit-code 1 fails the
      # job, which is the point — the scan is the gate, not a report.
      - name: Trivy — fail on any CRITICAL/HIGH/MEDIUM/LOW
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: xls-to-xlsx:ci
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: CRITICAL,HIGH,MEDIUM,LOW
          vuln-type: os,library

      # Proves the image still converts after any dependency bump. A clean scan
      # on an image that no longer works is not a passing build.
      - name: Smoke test — CSV to XLSX through the running container
        run: |
          docker run -d --name xls-ci -p 4040:4040 xls-to-xlsx:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4040/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:4040/health
          printf 'name,qty\nAlpha,3\nBeta,7\n' > sample.csv
          curl -fsS -o out.xlsx -F "file=@sample.csv;type=text/csv" http://localhost:4040/convert
          python3 -c "import zipfile,sys; z=zipfile.ZipFile('out.xlsx'); sys.exit(0 if 'xl/workbook.xml' in z.namelist() else 1)"
          echo "converted a CSV to a valid XLSX"
          docker rm -f xls-ci
